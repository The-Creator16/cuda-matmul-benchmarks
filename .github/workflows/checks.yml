name: Build and host checks
on: [push, pull_request, workflow_dispatch]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build-host -DBUILD_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-host --parallel
      - run: ctest --test-dir build-host --output-on-failure
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3 python3-pip g++
      - run: python3 -m pip install 'cmake>=3.24,<4'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=75
      - run: cmake --build build --parallel
      # GitHub-hosted runner has no GPU. This job proves compilation only.
